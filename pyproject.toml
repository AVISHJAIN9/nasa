[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astrocare"
version = "0.2.0"
description = "AstroCare: NASA Space Apps Decision-Support Prototype"
authors = [{ name = "AstroCare Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "pydantic>=2.6.0",
    "matplotlib>=3.8.0",
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
