services:
  mongo:
    image: mongo:7.0
    container_name: astrocare-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27018}:27017"
    environment:
      MONGO_INITDB_DATABASE: astrocare
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  timescale:
    image: timescale/timescaledb:latest-pg16
    container_name: astrocare-timescale
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astrocare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astrocare_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-astrocare_db}
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-astrocare} -d ${POSTGRES_DB:-astrocare_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  node-api:
    build:
      context: .
      dockerfile: backend/Dockerfile.node
    container_name: astrocare-node-api
    restart: unless-stopped
    ports:
      - "${NODE_PORT:-8000}:8000"
    environment:
      PORT: 8000
      MONGODB_URI: mongodb://mongo:27017/astrocare
      FASTAPI_URL: http://fastapi:8001
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_astrocare_2026_min_32_bytes}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
      CORS_ORIGINS: http://localhost:3000,http://localhost:3006,http://localhost:8000,http://localhost:8001
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  fastapi:
    build:
      context: .
      dockerfile: backend/Dockerfile.python
    container_name: astrocare-fastapi
    restart: unless-stopped
    ports:
      - "${FASTAPI_PORT:-8001}:8001"
    environment:
      POSTGRES_HOST: timescale
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-astrocare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astrocare_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-astrocare_db}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-astrocare}:${POSTGRES_PASSWORD:-astrocare_dev_password}@timescale:5432/${POSTGRES_DB:-astrocare_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_astrocare_2026_min_32_bytes}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
      CORS_ORIGINS: http://localhost:3000,http://localhost:3006,http://localhost:8000,http://localhost:8001
    depends_on:
      timescale:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: astrocare-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_INTERNAL_PORT:-3007}:3006"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3006/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: astrocare-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
      - "${FRONTEND_PORT:-3006}:3006"
    depends_on:
      node-api:
        condition: service_healthy
      fastapi:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/gateway/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo_data:
  timescale_data:
