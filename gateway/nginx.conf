upstream node_backend {
    server node-api:8000;
}

upstream fastapi_backend {
    server fastapi:8001;
}

upstream frontend_dev {
    server frontend:3006;
}

server {
    listen 80;
    listen 3006;
    server_name localhost;

    # Health check for the gateway itself
    location /gateway/health {
        access_log off;
        return 200 '{"status":"healthy","gateway":"nginx"}';
        add_header Content-Type application/json;
    }

    # FastAPI Multimodal & v3 sensor routes
    location ~* ^/api/v1/(audio|behavior|face-metrics|eye-metrics|gestures|motion|twin|panel|fed|mission|consent|sensors|passive|signals|readings|baseline-history|drift-watchdog|timescale-replay|v3-flags|security-events|ml-multimodal|gateway-service) {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Node.js API Primary Clinical routes
    location /api/ {
        proxy_pass http://node_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        proxy_pass http://node_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://node_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /metrics {
        proxy_pass http://node_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Frontend Single-Page App
    location / {
        proxy_pass http://frontend_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
